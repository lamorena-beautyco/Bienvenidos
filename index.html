<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamorena Beauty Co. | Enlaces Oficiales</title>
    <!-- Importamos una fuente elegante de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* VARIABLES DE COLOR */
        :root {
            --dorado: #D4AF37; /* Un dorado un poco más oscuro para que se lea bien en fondo claro */
            --rosa-pastel: #FADBD8; /* Rosa pastel suave */
            --rosa-fuerte: #F1948A; /* Rosa un poco más intenso para hover */
            --blanco: #ffffff;
            --texto-oscuro: #4A4A4A;
            --sombra: rgba(0, 0, 0, 0.08);
        }

        /* ESTILOS GENERALES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo claro con degradado rosa pastel */
            background: linear-gradient(135deg, #ffffff 0%, #FADBD8 100%);
            font-family: 'Montserrat', sans-serif;
            color: var(--texto-oscuro);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
            background: rgba(255, 255, 255, 0.6); /* Tarjeta blanca semitransparente */
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px var(--sombra);
            backdrop-filter: blur(10px);
        }

        /* LOGO */
        .logo {
            width: 100%;
            max-width: 300px;
            height: auto;
            margin-bottom: 15px;
            /* Si tu logo es PNG transparente, se verá perfecto aquí */
        }

        /* TÍTULO DE BIENVENIDA */
        .welcome-text {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--dorado);
            margin-bottom: 5px;
            font-style: italic;
            letter-spacing: 1px;
        }

        .sub-welcome {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            color: var(--texto-oscuro);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* BOTONES DE ENLACES */
        .link-card {
            display: block;
            background: var(--blanco);
            border: 2px solid var(--rosa-pastel);
            border-radius: 15px;
            padding: 18px 20px;
            margin-bottom: 15px;
            text-decoration: none;
            color: var(--texto-oscuro);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px var(--sombra);
        }

        /* Efecto al pasar el mouse */
        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--dorado);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
            background: #fffdfa;
        }

        /* Estilo para el texto dentro del botón */
        .link-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .link-icon {
            font-size: 1.5rem;
            color: var(--dorado);
        }

        .link-text {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--texto-oscuro);
        }

        /* Etiqueta pequeña debajo del texto */
        .link-subtext {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
            font-weight: 300;
            display: block;
        }

        /* SEPARADOR CORAZÓN */
        .separator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            gap: 15px;
        }

        .separator-line {
            height: 1px;
            width: 60px;
            background: linear-gradient(90deg, transparent, var(--dorado), transparent);
        }

        .separator-heart {
            color: var(--dorado);
            font-size: 1.2rem;
        }

        /* FOOTER */
        .footer {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #999;
            letter-spacing: 1px;
        }

        /* ANIMACIÓN DE ENTRADA */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ICONOS SVG */
        .icon-svg {
            width: 24px;
            height: 24px;
            fill: var(--dorado);
            transition: fill 0.3s;
        }
        
        .link-card:hover .icon-svg {
            fill: var(--rosa-fuerte);
        }

    </style>
</head>
