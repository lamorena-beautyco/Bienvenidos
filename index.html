<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamorena Beauty Co. | Enlaces Oficiales</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --amarillo-pastel: #FFF5CC;
            --amarillo-suave: #FFE9A8;
            --amarillo-dorado: #E6C878;
            --rosa-pastel: #FFE4E1;
            --rosa-suave: #FFD1DC;
            --rosa-fuerte: #F7A8B8;
            --blanco-crema: #FFFDF9;
            --blanco: #FFFFFF;
            --texto-oscuro: #4A403A;
            --texto-suave: #8A7F78;
            --sombra-suave: rgba(230, 200, 120, 0.15);
            --sombra-fuerte: rgba(247, 168, 184, 0.25);
            --verde-whatsapp: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #FFFDF9 0%, #FFF5CC 40%, #FFE4E1 100%);
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            color: var(--texto-oscuro);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            padding: 45px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 60px var(--sombra-suave);
            border: 1px solid rgba(230, 200, 120, 0.3);
        }

        /* LOGO */
        .logo {
            width: 100%;
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 5px 15px rgba(230, 200, 120, 0.4));
        }

        /* TÍTULOS */
        .welcome-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            color: var(--texto-oscuro);
            margin-bottom: 5px;
            font-style: italic;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .sub-welcome {
            font-size: 0.75rem;
            color: var(--rosa-fuerte);
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 400;
            margin-bottom: 35px;
        }

        /* BOTONES DE ENLACES */
        .link-card {
            display: block;
            background: var(--blanco);
            border: 2px solid var(--amarillo-pastel);
            border-radius: 60px;
            padding: 18px 25px;
            margin-bottom: 15px;
            text-decoration: none;
            color: var(--texto-oscuro);
            transition: all 0.4s ease;
            box-shadow: 0 8px 20px var(--sombra-suave);
            position: relative;
            overflow: hidden;
        }

        /* Efecto al pasar el mouse */
        .link-card:hover {
            transform: translateY(-4px);
            border-color: var(--rosa-fuerte);
            box-shadow: 0 15px 35px var(--sombra-fuerte);
            background: linear-gradient(135deg, var(--amarillo-pastel), var(--rosa-pastel));
        }

        /* Estilo para el texto dentro del botón */
        .link-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .link-icon {
            font-size: 1.5rem;
            color: var(--amarillo-dorado);
            transition: color 0.3s;
        }

        .link-card:hover .link-icon {
            color: var(--rosa-fuerte);
        }

        .link-text {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--texto-oscuro);
        }

        /* SEPARADOR CORAZÓN */
        .separator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0 20px;
            gap: 15px;
        }

        .separator-line {
            height: 1px;
            width: 60px;
            background: linear-gradient(90deg, transparent, var(--amarillo-dorado), transparent);
        }

        .separator-heart {
            color: var(--rosa-fuerte);
            font-size: 1.2rem;
        }

        /* FOOTER */
        .footer {
            margin-top: 25px;
            font-size: 0.7rem;
            color: var(--texto-suave);
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .welcome-text { font-size: 1.8rem; }
            .container { padding: 30px 20px; }
            .logo { max-width: 180px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGO (Reemplaza el src con la URL de tu logo PNG) -->
        <!-- Si no tienes logo, puedes borrar esta línea o dejarla vacía -->
        <img src="https://i.ibb.co/6P0yC8q/logo-lamorena.png" alt="Lamorena Beauty Co." class="logo">

        <!-- TEXTO DE BIENVENIDA -->
        <h1 class="welcome-text">Bienvenidos a Lamorena</h1>
        <p class="sub-welcome">Beauty Co.</p>

        <!-- BOTÓN 1: TIENDA ONLINE -->
        <a href="https://lamorena-beautyco.github.io/La-Morenaa/" target="_blank" class="link-card">
            <div class="link-content">
                <span class="link-icon">🛍️</span>
                <span class="link-text">Tienda Online</span>
            </div>
        </a>

        <!-- BOTÓN 2: CATÁLOGO CANVA -->
        <a href="https://canva.link/en9xvddeiq64s0v" target="_blank" class="link-card">
            <div class="link-content">
                <span class="link-icon">📖</span>
                <span class="link-text">Catálogo Completo</span>
            </div>
        </a>

        <!-- BOTÓN 3: WHATSAPP ASESORÍAS -->
        <a href="https://wa.me/573332267596" target="_blank" class="link-card">
            <div class="link-content">
                <span class="link-icon">💬</span>
                <span class="link-text">Asesoría por WhatsApp</span>
            </div>
        </a>

        <!-- BOTÓN 4: TIKTOK -->
        <a href="https://www.tiktok.com/@lamorena8847?_r=1&_t=ZS-99pHNXKhuGv" target="_blank" class="link-card">
            <div class="link-content">
                <span class="link-icon">🎵</span>
                <span class="link-text">Síguenos en TikTok</span>
            </div>
        </a>

        <!-- SEPARADOR DECORATIVO -->
        <div class="separator">
            <div class="separator-line"></div>
            <div class="separator-heart">♥</div>
            <div class="separator-line"></div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            &copy; 2024 LAMORENA BEAUTY CO.
        </div>

    </div>

</body>
</html>
